name: Staging Auto-Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/pr-validation.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign Docker image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Save current image tag (for deterministic rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/flash-archi
            CURRENT_TAG=$(docker compose config --format json | jq -r '.services.api.image' | cut -d: -f2)
            echo "$CURRENT_TAG" > .previous-image-tag

      - name: Pull and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/flash-archi
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 30
            docker compose ps | grep -q "healthy" || exit 1

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/flash-archi
            docker compose run --rm api npm run migrate:up

  smoke-test:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download smoke test
        run: |
          curl -L -o smoke-test.sh https://raw.githubusercontent.com/flash-archi/flash-archi/main/smoke-test.sh
          chmod +x smoke-test.sh
      - name: Execute smoke tests
        run: ./smoke-test.sh https://staging.flash-archi.local ${{ secrets.STAGING_API_KEY }}

  e2e-tests:
    needs: smoke-test
    uses: ./.github/workflows/e2e-tests.yml
    with:
      base_url: https://staging.flash-archi.local
    secrets:
      api_key: ${{ secrets.STAGING_API_KEY }}

  validate-staging:
    needs: [smoke-test, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check if all staging tests passed
        run: |
          if [ "${{ needs.smoke-test.result }}" != "success" ] || [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ Staging validation failed (smoke-test: ${{ needs.smoke-test.result }}, e2e-tests: ${{ needs.e2e-tests.result }})"
            exit 1
          fi
          echo "✅ All staging tests passed"

  rollback-on-failure:
    needs: validate-staging
    if: failure()
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Rollback to previous image (deterministic, saved tag)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/flash-archi
            PREVIOUS_TAG=$(cat .previous-image-tag)
            echo "Rolling back to ghcr.io/flash-archi:$PREVIOUS_TAG"
            docker compose down
            docker compose up -d ghcr.io/flash-archi:$PREVIOUS_TAG
            sleep 30
            docker compose ps | grep -q "healthy" || exit 1

  notify:
    needs: [rollback-on-failure, validate-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#flash-archi-deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Create Grafana annotation
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/flash-archi
            ./scripts/add-grafana-annotation.sh staging "Deploy ${{ github.sha }}" 0